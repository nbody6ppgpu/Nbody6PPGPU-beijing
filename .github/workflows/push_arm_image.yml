name: Publish ARM64 CI dependencies

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ci/Dockerfile.deps
      - .github/workflows/push_arm_image.yml
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ci/Dockerfile.deps
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:deps-arm64-ubuntu22.04
          cache-from: type=gha
          cache-to: type=gha,mode=max
