name: Demo simulation test

on:
  push:
    branches: [ stable , dev ]
  pull_request:
    branches: [ stable , dev ]

jobs:
  new_namelist_input_10k:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7

    - name: install dependencies
      run: sudo apt update && sudo apt install -y autoconf=2.71-2 wget gfortran gcc g++; gcc --version; g++ --version; gfortran --version;

    - name: configure architecture regressions
      run: |
        test "$(autoconf --version | sed -n '1s/.* //p')" = 2.71
        cp configure configure.committed
        autoconf
        diff -u configure.committed configure

        ./configure --with-par=1k --disable-mpi --disable-gpu --disable-hdf5 > x86-configure.log
        grep -Fq "target architecture: x86_64" x86-configure.log
        grep -Fq "Canonical host:      x86_64" x86-configure.log
        grep -Fq "mcmodel:        large" x86-configure.log

        if ./configure --host=riscv64-linux-gnu > unsupported.log 2>&1; then
          echo "unsupported host unexpectedly succeeded"
          exit 1
        fi
        grep -Fq "Supported target architectures: x86_64 and ARM64/aarch64" unsupported.log
        grep -Fq "x86_64 example:" unsupported.log
        grep -Fq "ARM64 example:" unsupported.log

        ./configure --with-par=1k --disable-mpi --disable-gpu --disable-hdf5 --enable-simd=no > x86-nosimd-configure.log 2>&1
        grep -Fq "Using SIMD:     no" x86-nosimd-configure.log
        grep -Fq "SIMD is disabled (--enable-simd=no); OpenMP is being disabled" x86-nosimd-configure.log
        grep -Fq "OpenMP option:  " x86-nosimd-configure.log
        ! grep -Fq "OpenMP option:  -fopenmp" x86-nosimd-configure.log

    - name: configure
      run: >
        ./configure --with-par=b1m --enable-simd=sse --enable-mcmodel=large --disable-mpi --disable-gpu --disable-hdf5;

    - name: make
      run: make clean; make;

    - name: prepare simulation
      run: >
        mkdir autotest;
        cp -p ./build/nbody6++.sse ./autotest/;
        cp -p ./examples/input_files/N100k.inp ./autotest/;
        cp -p ./examples/input_files/dat.10 ./autotest/;
        cd autotest;
        sed -r 's/\bN=[0-9]*/N=15000/g' N100k.inp | sed -r 's/\bTCRIT=[0-9]*/TCRIT=1/g' > N10k_1nbtime.inp ;
        pwd; ls -alh;

    - name: simulation
      run: >
        ulimit -s unlimited; 
        cd autotest; 
        export OMP_NUM_THREADS=$((`grep -c processor /proc/cpuinfo` < 32 ? `grep -c processor /proc/cpuinfo` : 32)); 
        export execname=`ls nbody6++*`; 
        ./$execname < N10k_1nbtime.inp;


  mpi_and_hdf5:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: install dependencies
      run: > 
        [[ $(curl -s http://ip-api.com | grep countryCode) =~ CN|HK ]] && wget -4 https://tuna.moe/oh-my-tuna/oh-my-tuna.py -P ~/ && sudo python3 ~/oh-my-tuna.py --global --yes;
        sudo apt update && sudo apt install -y wget gfortran gcc g++ libhdf5-dev openmpi-bin openmpi-common libopenmpi-dev && gcc --version && g++ --version && mpif77 --version

    - name: configure
      run: >
        ./configure --with-par=b1m --enable-mcmodel=large --disable-gpu

    - name: make
      run: make clean && make -j

    - name: prepare simulation
      run: >
        mkdir autotest;
        cp -p ./examples/input_files/N100k.inp ./autotest/;
        cp -p ./examples/input_files/dat.10 ./autotest/;
        cd autotest;
        sed -r 's/\bN=[0-9]*/N=10000/g' N100k.inp | sed -r 's/\bTCRIT=[0-9]*/TCRIT=1/g' > N10k_1nbtime.inp ;
        pwd; ls -alh;

    - name: simulation
      run: >
        ulimit -s unlimited; 
        cd autotest; 
        export OMP_NUM_THREADS=$((`grep -c processor /proc/cpuinfo` < 32 ? `grep -c processor /proc/cpuinfo` : 32)); 
        export EXEC=`ls ../build/nbody6++*`; 
        mpirun --allow-run-as-root --bind-to none -n 1 $EXEC < N10k_1nbtime.inp | tee mpirun.errout || $EXEC < N10k_1nbtime.inp | tee nompirun.errout || grep 'END RUN' *errout ;
        ls -alh;
