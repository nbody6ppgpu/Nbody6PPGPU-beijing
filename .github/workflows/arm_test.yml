name: ARM64 simulation test

on:
  push:
    branches: [ stable, dev ]
  pull_request:
    branches: [ stable, dev ]

permissions:
  contents: read

jobs:
  arm64_qemu_1k:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v3

    - name: Set up QEMU for ARM64 emulation
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/arm64

    - name: Build and test on ARM64
      run: |
        docker run --rm --platform linux/arm64 \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          ghcr.io/${{ github.repository }}:deps-arm64-latest \
          bash -c '
            set -euo pipefail
            
            echo "=== Installing dependencies ==="
            apt-get update
            apt-get install -y gfortran gcc g++ openmpi-bin openmpi-common libopenmpi-dev make

            echo "=== Compiler versions ==="
            gcc --version
            g++ --version
            gfortran --version
            mpif77 --version
            uname -m

            echo "=== Configuring for ARM64 ==="
            ./configure --with-par=b16k --disable-gpu

            echo "=== Building ==="
            make clean
            make -j$(nproc)

            echo "=== Preparing simulation ==="

            mkdir -p autotest
            cp -p ./examples/input_files/@input-transform ./autotest/;
            cp -p ./examples/example_1k/1k.inp ./autotest/
            cd autotest;
            sed -r "s/\bTCRIT=[0-9]*/TCRIT=2/g" 1k.inp > 1k.inp
            ulimit -s unlimited; 
            export OMP_NUM_THREADS=1
            ln -sf ../build/nbody6++.* ./
            pwd; ls -alh;
            export execname=`ls nbody6++*`; 
            mpirun --allow-run-as-root --bind-to none -n 2 ./$execname < 1k.inp | tee errout
            ls -lhSr

            echo "=== Simulation completed ==="
            grep -Eq "END RUN|TERMINATE" errout || { echo "Simulation did not finish correctly"; exit 1; }
          '
    - name: Upload autotest artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: arm64-autotest-debug
        path: |
          autotest/simulation.log

    - name: Start tmate on failure
      if: failure()
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        
