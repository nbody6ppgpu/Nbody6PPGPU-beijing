name: ARM64 simulation test

on:
  push:
    branches: [stable, dev]
  pull_request:
    branches: [stable, dev]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  arm64_native_1k:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf=2.71-2 \
            g++ \
            gcc \
            gfortran \
            git \
            libopenmpi-dev \
            make \
            openmpi-bin

      - name: Build and test on ARM64
        run: |
          set -o pipefail
          autoconf --version | head -1
          test "$(autoconf --version | sed -n "1s/.* //p")" = 2.71
          uname -m

          # Mirrors the "sibling of the source tree" default SIMDe path that
          # configure computes itself (source_parent/simde). Under the old
          # QEMU/Docker job the repo lived at /workspace, so the sibling was
          # /simde; natively the checkout lives under $GITHUB_WORKSPACE, so
          # the equivalent sibling path is computed here instead of hardcoded.
          simde_dir="$(dirname "$GITHUB_WORKSPACE")/simde"
          git clone --branch v0.8.2 --depth 1 \
            https://github.com/simd-everywhere/simde.git "$simde_dir"

          cp configure configure.committed
          autoconf
          diff -u configure.committed configure

          ./configure --with-par=1k --disable-gpu --disable-hdf5 > arm-default.log
          grep -Fq "target architecture: ARM64" arm-default.log
          grep -Fq "Using SIMD:     sse" arm-default.log
          grep -Fq "Using SIMDe:    yes (path: $simde_dir)" arm-default.log
          grep -Fq "mcmodel:        no" arm-default.log

          for invalid_option in --enable-simd=avx \
            --enable-mcmodel=small --enable-mcmodel=medium --enable-mcmodel=large \
            --without-simde; do
            if ./configure --disable-gpu --disable-hdf5 "$invalid_option" > invalid.log 2>&1; then
              echo "$invalid_option unexpectedly succeeded"
              exit 1
            fi
            grep -Fq "ARM64 example: ./configure" invalid.log
          done

          ./configure --with-par=1k --disable-gpu --disable-hdf5 --enable-simd=no > arm-nosimd-configure.log 2>&1
          grep -Fq "Using SIMD:     no" arm-nosimd-configure.log
          grep -Fq "Using SIMDe:    no" arm-nosimd-configure.log
          grep -Fq "SIMD is disabled (--enable-simd=no); OpenMP is being disabled" arm-nosimd-configure.log
          make clean
          make -j 4

          if ./configure --disable-gpu --disable-hdf5 --with-simde=/does/not/exist > bad-path.log 2>&1; then
            echo "missing SIMDe path unexpectedly succeeded"
            exit 1
          fi
          grep -Fq "SIMDe include location does not exist: /does/not/exist" bad-path.log

          mkdir -p /tmp/incomplete/simde/x86
          touch /tmp/incomplete/simde/x86/sse.h
          if ./configure --disable-gpu --disable-hdf5 --with-simde=/tmp/incomplete > incomplete.log 2>&1; then
            echo "incomplete SIMDe headers unexpectedly succeeded"
            exit 1
          fi
          grep -Fq "SIMDe header is missing:" incomplete.log

          cp -a "$simde_dir" /tmp/uncompilable
          printf "#error intentional CI probe\n" > /tmp/uncompilable/simde/x86/sse.h
          if ./configure --disable-gpu --disable-hdf5 --with-simde=/tmp/uncompilable > uncompilable.log 2>&1; then
            echo "uncompilable SIMDe headers unexpectedly succeeded"
            exit 1
          fi
          grep -Fq "required SIMDe headers are not compilable" uncompilable.log

          sudo cp -a "$simde_dir/simde" /usr/local/include/simde
          ./configure --with-par=1k --disable-gpu --disable-hdf5 --with-simde > system-simde.log
          grep -Fq "Using SIMDe:    yes (system path)" system-simde.log

          ./configure --build=x86_64-pc-linux-gnu --host=aarch64-linux-gnu \
            --with-par=1k --disable-gpu --disable-hdf5 > cross.log
          grep -Fq "cross compilation: build=x86_64-pc-linux-gnu, host=aarch64-unknown-linux-gnu" cross.log
          grep -Fq "Target architecture: ARM64" cross.log

          ./configure --with-par=1k --disable-gpu --disable-hdf5
          make clean
          make -j 4

          mkdir -p autotest
          cp -p examples/example_1k/1k.inp autotest/
          cd autotest
          sed -i -E "s/\bTCRIT=[0-9]+/TCRIT=2/g" 1k.inp
          ulimit -s unlimited
          export OMP_NUM_THREADS=1
          execname=$(find ../build -maxdepth 1 -type f -name "nbody6++*" -perm -111 -print -quit)
          test -n "$execname"
          mpirun --bind-to none -n 2 \
            "$execname" < 1k.inp 2>&1 | tee errout
          grep -Fq "END RUN" errout
          ! grep -Eiq "(^|[^[:alpha:]])nan([^[:alpha:]]|$)|segmentation fault" errout

      - name: Upload ARM64 simulation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-autotest-output
          if-no-files-found: warn
          path: |
            autotest/errout
            autotest/OUT*
            autotest/*.7
            autotest/*.82
            autotest/*.83*
